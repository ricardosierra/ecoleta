name: secret-scan

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks precisa do historico para o range base..HEAD

      # Binario do gitleaks: o gitleaks-action@v2 exige licenca paga em org.
      # Varre so os commits novos (base..HEAD) em vez da arvore inteira: e rapido
      # e nao repete falso-positivo de dependencia/seed que ja estava no historico.
      - name: Secret scan (gitleaks)
        run: |
          set -euo pipefail
          VERSION=8.30.1
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xzf - gitleaks
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          # push de branch nova / primeiro push: before vem zerado
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="$(git rev-parse HEAD~1 2>/dev/null || git rev-list --max-parents=0 HEAD | tail -1)"
          fi
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE="$(git rev-list --max-parents=0 HEAD | tail -1)"
          fi
          echo "Varrendo $BASE..HEAD"
          ./gitleaks git . --log-opts="$BASE..HEAD" --redact --no-banner --exit-code 1
